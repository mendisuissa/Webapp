name: CEO ops (Azure diagnose / restart)

# Lets the CEO agent diagnose this app's Azure App Service, and restart it when it is down, with the
# same OIDC login the deploy workflow uses. There are no stored keys. This repository's logs are
# public, so print only service state, bindings, certificate dates and HTTP codes; never app logs or
# settings.
on:
  workflow_dispatch:
    inputs:
      action:
        description: list (all apps in the group), plans (read-only cost inputs), diagnose (read-only), metrics (read-only, numeric only) or restart
        required: true
        default: diagnose
        type: choice
        options: [list, plans, diagnose, metrics, restart, entra-revoke-leaked]
      app:
        description: App Service name (default is this repo's app)
        required: false
        default: ModernE-Wa
      host:
        description: Public host to probe (default is this repo's host)
        required: false
        default: app.modernendpoint.tech
      health:
        description: Health path to probe
        required: false
        default: /api/health
      hint:
        description: For entra-revoke-leaked only, the 3-character hint of a leaked client secret
        required: false
        default: ''

permissions: {}

concurrency:
  group: ceo-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      APP: ${{ inputs.app }}
      HOST: ${{ inputs.host }}
      HEALTH_PATH: ${{ inputs.health }}
      HINT: ${{ inputs.hint }}
      ACTION: ${{ inputs.action }}
    steps:
      # Inputs reach the shell only through env and are validated before use.
      - name: Validate inputs
        run: |
          [[ "$APP" =~ ^[A-Za-z0-9-]{2,60}$ ]] || { echo "bad app"; exit 1; }
          [[ "$HOST" =~ ^[a-z0-9.-]{3,100}$ ]] || { echo "bad host"; exit 1; }
          [[ "$HEALTH_PATH" =~ ^/[A-Za-z0-9/_.-]{0,80}$ ]] || { echo "bad health path"; exit 1; }
          if [ "$ACTION" = entra-revoke-leaked ]; then [[ "$HINT" =~ ^[A-Za-z0-9~._-]{3}$ ]] || { echo "bad hint"; exit 1; }; fi

      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: List apps
        if: inputs.action == 'list'
        run: |
          az webapp list --query "[].{name:name, state:state, rg:resourceGroup, hosts:join(', ', hostNames)}" -o table | tee -a "$GITHUB_STEP_SUMMARY"

      # Read-only cost inputs for the CEO's cost map (KillWindowsApp-Mvp #32). Prints plan names, SKUs,
      # worker counts and site counts, and month-to-date cost totals per service if this identity may
      # read Cost Management. Never resource IDs, app settings, environment or app logs.
      - name: Plans and month-to-date cost
        if: inputs.action == 'plans'
        run: |
          {
            echo "### App Service plans (whole subscription)"
            echo '```'
            az appservice plan list --query "[].{plan:name, location:location, sku:sku.name, tier:sku.tier, workers:sku.capacity, sites:numberOfSites, kind:kind}" -o table
            echo '```'
            echo "### Other billable resource types in the subscription (counts only)"
            echo '```'
            az resource list --query "[].type" -o tsv | sort | uniq -c | sort -rn
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          SUB=$(az account show --query id -o tsv)
          BODY='{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"cost":{"name":"Cost","function":"Sum"}},"grouping":[{"type":"Dimension","name":"ServiceName"}]}}'
          PREV='{"type":"ActualCost","timeframe":"TheLastMonth","dataset":{"granularity":"None","aggregation":{"cost":{"name":"Cost","function":"Sum"}},"grouping":[{"type":"Dimension","name":"ServiceName"}]}}'
          for pair in "month-to-date:$BODY" "last-month:$PREV"; do
            label=${pair%%:*}; body=${pair#*:}
            {
              echo "### Actual cost, $label, by service"
              echo '```'
              if out=$(az rest --method post --url "https://management.azure.com/subscriptions/$SUB/providers/Microsoft.CostManagement/query?api-version=2023-03-01" --body "$body" -o json 2>/dev/null); then
                echo "$out" | jq -r '.properties as $p | ($p.columns | map(.name)) as $c | $p.rows[] | [.[($c|index("ServiceName"))], (.[($c|index("Cost"))]*100|round/100), .[($c|index("Currency"))]] | @tsv'
              else
                echo "cost query unavailable to this identity"
              fi
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Diagnose
        if: inputs.action == 'diagnose' || inputs.action == 'restart'
        run: |
          RG=$(az resource list --name "$APP" --resource-type Microsoft.Web/sites --query "[0].resourceGroup" -o tsv)
          [ -n "$RG" ] || { echo "App Service $APP not found or not visible to this identity"; exit 1; }
          echo "RG=$RG" >> "$GITHUB_ENV"
          echo "### $APP" >> "$GITHUB_STEP_SUMMARY"
          az webapp show -n "$APP" -g "$RG" \
            --query "{state:state, availability:availabilityState, httpsOnly:httpsOnly, defaultHost:defaultHostName, enabledHosts:enabledHostNames}" -o json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- hostname bindings"
          az webapp config hostname list --webapp-name "$APP" -g "$RG" --query "[].{name:name, sslState:sslState}" -o table
          echo "--- certificates in the resource group"
          az webapp config ssl list -g "$RG" --query "[].{subject:subjectName, expires:expirationDate}" -o table
          DEFAULT=$(az webapp show -n "$APP" -g "$RG" --query defaultHostName -o tsv)
          echo "DEFAULT=$DEFAULT" >> "$GITHUB_ENV"
          echo "--- probes"
          for url in "https://$HOST$HEALTH_PATH" "https://$DEFAULT$HEALTH_PATH"; do
            curl -sS -o /dev/null -m 30 -w "%{http_code} %{time_total}s $url\n" "$url" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          done
          echo "--- TLS on the custom domain"
          echo | timeout 20 openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null | openssl x509 -noout -subject -enddate 2>&1 || echo "TLS handshake failed for $HOST"

      # Numeric Azure Monitor metrics: last 6 hours (15-minute buckets) and a 7-day avg/peak summary. Prints only metric
      # names, timestamps and numbers: never resource IDs, app settings, environment or app logs.
      - name: Metrics (last 6 h and 7-day summary)
        if: inputs.action == 'metrics'
        run: |
          RG=$(az resource list --name "$APP" --resource-type Microsoft.Web/sites --query "[0].resourceGroup" -o tsv)
          [ -n "$RG" ] || { echo "App Service $APP not found or not visible to this identity"; exit 1; }
          SITE_ID=$(az webapp show -n "$APP" -g "$RG" --query id -o tsv)
          PLAN_ID=$(az webapp show -n "$APP" -g "$RG" --query appServicePlanId -o tsv)
          table() {
            jq -r '.value[] | .name.value as $n | .timeseries[]?.data[]?
              | [$n, (.timeStamp[11:16]),
                 ((.total // .average // .maximum // 0) * 100 | round / 100),
                 ((.maximum // 0) * 100 | round / 100)] | @tsv'
          }
          {
            echo "### $APP metrics, last 6 h, 15-min buckets (UTC)"
            echo '```'
            printf "metric\ttime\tvalue\tmax\n"
            # One metric per call, so an unsupported name cannot blank the others. On failure print
            # only the Azure error code (never the message, which can carry resource IDs).
            metric() { # resource, offset, interval, name, aggregations...
              res=$1 off=$2 iv=$3 name=$4; shift 4
              if out=$(az monitor metrics list --resource "$res" --offset "$off" --interval "$iv" \
                    --metrics "$name" --aggregation "$@" -o json 2>/tmp/metric.err); then
                echo "$out" | table
              else
                code=$(grep -oE '\(([A-Za-z]+)\)|Code: [A-Za-z]+' /tmp/metric.err | head -1 | tr -d '()' | sed 's/Code: //')
                printf "%s\tunavailable\t%s\n" "$name" "${code:-error}"
              fi
            }
            # Window summary: average and peak over every bucket.
            summary() { # resource, name, aggregation
              if out=$(az monitor metrics list --resource "$1" --offset 7d --interval PT1H \
                    --metrics "$2" --aggregation Average Maximum -o json 2>/tmp/metric.err); then
                echo "$out" | jq -r --arg n "$2" '[.value[].timeseries[]?.data[]?] as $d
                  | [$n, "7d", (([$d[].average | numbers] | if length > 0 then add / length else null end) // "no-data" | if type == "number" then (. * 100 | round / 100) else . end),
                     (([$d[].maximum | numbers] | max) // "no-data" | if type == "number" then (. * 100 | round / 100) else . end)] | @tsv'
              else
                code=$(grep -oE '\(([A-Za-z]+)\)|Code: [A-Za-z]+' /tmp/metric.err | head -1 | tr -d '()' | sed 's/Code: //')
                printf "%s\t7d\tunavailable\t%s\n" "$2" "${code:-error}"
              fi
            }
            for m in Requests Http5xx Http4xx; do metric "$SITE_ID" 6h PT15M "$m" Total Maximum; done
            for m in HttpResponseTime CpuTime MemoryWorkingSet AverageMemoryWorkingSet HealthCheckStatus; do
              metric "$SITE_ID" 6h PT15M "$m" Average Maximum
            done
            echo "--- 7-day summary (metric, window, average, peak); MemoryWorkingSet in bytes"
            printf "metric\twindow\tavg\tpeak\n"
            summary "$SITE_ID" MemoryWorkingSet
            summary "$SITE_ID" CpuTime
            echo "--- plan (shared by every app on it): 7-day summary, percent"
            summary "$PLAN_ID" CpuPercentage
            summary "$PLAN_ID" MemoryPercentage
            echo "--- plan, last 6 h"
            for m in CpuPercentage MemoryPercentage; do metric "$PLAN_ID" 6h PT15M "$m" Average Maximum; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restart
        if: inputs.action == 'restart'
        run: |
          az webapp restart -n "$APP" -g "$RG"
          echo "Restarted $APP; waiting for warm-up"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -m 30 -w "%{http_code}" "https://$HOST$HEALTH_PATH" || echo 000)
            echo "attempt $i: $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then echo "healthy: $code" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 15
          done
          echo "still unhealthy after restart" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Revokes one client secret that leaked (for example into logs). It finds the app registration
      # whose password credential has this hint, and deletes only that credential, and only when
      # exactly one credential matches. It prints app display names, app IDs and key IDs, never a
      # secret value.
      - name: Revoke leaked Entra client secret
        if: inputs.action == 'entra-revoke-leaked'
        run: |
          matches=$(az ad app list --all --query "[].{app:appId, name:displayName, keys:passwordCredentials[?hint=='$HINT'].keyId}" -o json \
            | jq -c '[.[] | select(.keys | length > 0) | {app, name, key: .keys[]}]')
          count=$(echo "$matches" | jq length)
          echo "credentials matching the hint: $count" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$matches" | jq -r '.[] | "\(.name) app=\(.app) key=\(.key)"' | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$count" = 1 ] || { echo "not exactly one match; nothing revoked" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          app=$(echo "$matches" | jq -r '.[0].app'); key=$(echo "$matches" | jq -r '.[0].key')
          az ad app credential delete --id "$app" --key-id "$key"
          left=$(az ad app credential list --id "$app" --query "[?keyId=='$key'] | length(@)" -o tsv)
          [ "$left" = 0 ] && echo "revoked key $key on app $app" | tee -a "$GITHUB_STEP_SUMMARY" || { echo "credential still present"; exit 1; }
